<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" type="text/css" href="../css//index.css"> <!--Código que chama o "css" para o html-->

</head>
<body>   <!--Class= é um tipo de seletor do CSS, todos os elementos que receberem a classe desejada serao mudados, assim como a classe por "ID".-->   
   

    
   



    <div class="container-principal">
        <div class="formulario">
            <form id="form-cadastro" action="../php/cadastrar-produto.php" method="POST">

                <h3> Cadastro Produto </h3>
                <hr>
                <input type="text" name="nomeProduto" placeholder="Nome do Produto" required="true" 
                minlength="3" maxlength="30">
                <br><br>
                <input type="text" name="marca" placeholder="Marca" required="true" 
                minlength="3" maxlength="30">
                <br><br>
                <input type="text" name="preco" placeholder="Preço" required="true" 
                minlength="3" maxlength="8">
                <br><br>
                <input type="text" name="descricao" placeholder="Descrição"  required="true" 
                minlength="3" maxlength="30">
                <br><br>
                <input type="submit" value="Salvar Produto">
            </form>
        </div>
    </div>
</body>
</html>
