<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" type="text/css" href="./css//index.css"> <!--Código que chama o "css" para o html-->

</head>
<body>   <!--Class= é um tipo de seletor do CSS, todos os elementos que receberem a classe desejada serao mudados, assim como a classe por "ID".-->   
   

    <div class="cabecario">
        <header>
            <ul>
                 <li>Já tem uma conta?</li>
                 <a href="./index.html"><button><li>Logue</li></button></a>
             </ul>
        </header>
    </div>
   



    <div class="container-principal">
        <div class="formulario">
            <form id="form-cadastro" action="./php/cadastrar-usuario.php" method="POST">

                <h3> Cadastro </h3>
                <hr>
                <input type="text" name="usuario" placeholder="Usuário" required="true" 
                minlength="3" maxlength="30">
                <br><br>
                <input type="text" name="nome" placeholder="Nome" required="true" 
                minlength="3" maxlength="30">
                <br><br>
                <input type="password" name="senha" placeholder="Senha" required="true" 
                minlength="3" maxlength="8">
                <br><br>
                <input type="email" name="email" placeholder="Email"  required="true" 
                minlength="3" maxlength="30">
                <br><br>
                <input type="submit" value="Cadastrar">
            </form>
        </div>
    </div>
</body>
</html>
